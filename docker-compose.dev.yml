services:
  postgres:
    image: postgres:16-alpine
    container_name: wa-kijo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wakijo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wakijo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wakijo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wakijo} -d ${POSTGRES_DB:-wakijo}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wa-kijo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: wa-kijo-postgres-data
  redis_data:
    name: wa-kijo-redis-data
