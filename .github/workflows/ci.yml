name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the engines field in package.json
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ─── Static checks: typecheck + lint + build ─────────────────────────────
  static:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        # @wa-kijo/api and @wa-kijo/web consume these via dist/ in CI.
        run: |
          pnpm --filter @wa-kijo/shared build
          pnpm --filter @wa-kijo/db build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build (api + web)
        run: pnpm build

  # ─── Unit tests ──────────────────────────────────────────────────────────
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm --filter @wa-kijo/shared build
          pnpm --filter @wa-kijo/db build

      - name: Run unit tests
        run: pnpm test

  # ─── Integration tests with real Postgres + Redis ────────────────────────
  # Tests cross-tenant isolation against an actual database — the most
  # important test in this codebase. See .claude/rules/security.md.
  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wakijo
          POSTGRES_PASSWORD: wakijo_dev_password
          POSTGRES_DB: wakijo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wakijo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wakijo:wakijo_dev_password@localhost:5432/wakijo_test?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci_test_secret_at_least_32_characters_long_for_validation
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_test_dummy_key
      EMAIL_FROM: noreply@example.com
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm --filter @wa-kijo/shared build
          pnpm --filter @wa-kijo/db build

      - name: Apply migrations
        run: pnpm --filter @wa-kijo/db exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm test:integration
