<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="wa'kijo — production-grade multi-tenant B2B SaaS foundation. Layered architecture showing Frontend, API, Auth and RBAC, Multi-tenancy, Domain modules, and Infrastructure, with cross-cutting concerns of Zod validation, tenant isolation, and audit logging.">

  <!-- Background -->
  <rect width="1200" height="880" fill="#fafafa"/>

  <!-- ============================================================
       Header
       ============================================================ -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-size="44" font-weight="700" fill="#0f172a" letter-spacing="-0.5">wa'kijo</text>
    <text x="0" y="36" font-size="18" font-weight="400" fill="#475569" letter-spacing="0.2">Production-grade, opinionated SaaS foundation for multi-tenant B2B products</text>

    <!-- License badge -->
    <g transform="translate(960, -2)">
      <rect x="0" y="0" width="170" height="34" rx="6" fill="#1f2937"/>
      <text x="14" y="22" font-size="14" font-weight="600" fill="#fff">Apache 2.0</text>
      <rect x="78" y="0" width="92" height="34" rx="6" fill="#0ea5e9"/>
      <text x="92" y="22" font-size="14" font-weight="600" fill="#fff">Open Source</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="60" y1="100" x2="1140" y2="100" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============================================================
       Layer stack (6 layers, top to bottom = user-facing to infrastructure)
       Geometry: each layer is 90px tall, 880px wide, starts at x=60
       Cross-cutting concerns column on the right (x=960..1140)
       ============================================================ -->

  <!-- ─── Layer 1 — Frontend ─────────────────────────────────────────── -->
  <g transform="translate(60, 130)">
    <rect width="880" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#5b21b6" letter-spacing="0.5">FRONTEND</text>
    <text x="20" y="52" font-size="13" fill="#6b21a8">Next.js 15 App Router · server components by default</text>

    <g transform="translate(380, 22)">
      <g transform="translate(0, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">Next.js 15</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">shadcn/ui</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">Tailwind CSS</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">TanStack Query</text>
      </g>
      <g transform="translate(64, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">React Hook Form</text>
      </g>
      <g transform="translate(192, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">Better Auth client</text>
      </g>
      <g transform="translate(320, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#a78bfa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#5b21b6" text-anchor="middle">lucide-react</text>
      </g>
    </g>
  </g>

  <!-- ─── Layer 2 — API ─────────────────────────────────────────── -->
  <g transform="translate(60, 230)">
    <rect width="880" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="0.5">API</text>
    <text x="20" y="52" font-size="13" fill="#1d4ed8">NestJS 11 + Fastify · Zod-validated DTOs · auto-Swagger</text>

    <g transform="translate(380, 22)">
      <g transform="translate(0, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">NestJS 11</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">Fastify adapter</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">nestjs-zod</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">Swagger UI</text>
      </g>
      <g transform="translate(64, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">HttpExceptionFilter</text>
      </g>
      <g transform="translate(192, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">TransformInterceptor</text>
      </g>
      <g transform="translate(320, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#60a5fa"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1e3a8a" text-anchor="middle">Pino logging</text>
      </g>
    </g>
  </g>

  <!-- ─── Layer 3 — Auth & RBAC ─────────────────────────────────────────── -->
  <g transform="translate(60, 330)">
    <rect width="880" height="90" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#115e59" letter-spacing="0.5">AUTH &amp; RBAC</text>
    <text x="20" y="52" font-size="13" fill="#0f766e">Better Auth · APP_GUARD chain · role inheritance up the org tree</text>

    <g transform="translate(380, 22)">
      <g transform="translate(0, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">Better Auth ≥1.5</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">AuthGuard</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">PermissionGuard</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">AsyncLocalStorage</text>
      </g>
      <g transform="translate(64, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">Email + password</text>
      </g>
      <g transform="translate(192, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">Magic link</text>
      </g>
      <g transform="translate(320, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#2dd4bf"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#115e59" text-anchor="middle">Google OAuth</text>
      </g>
    </g>
  </g>

  <!-- ─── Layer 4 — Multi-tenancy ─────────────────────────────────────────── -->
  <g transform="translate(60, 430)">
    <rect width="880" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#14532d" letter-spacing="0.5">MULTI-TENANCY</text>
    <text x="20" y="52" font-size="13" fill="#166534">SYSTEM → AGENCY → WORKSPACE · automatic tenant scoping on every query</text>

    <!-- 3-level hierarchy inline -->
    <g transform="translate(380, 28)" font-size="10" font-weight="600">
      <rect x="0" y="0" width="76" height="40" rx="6" fill="#fff" stroke="#4ade80" stroke-width="1.5"/>
      <text x="38" y="16" fill="#14532d" text-anchor="middle">SYSTEM</text>
      <text x="38" y="30" fill="#166534" text-anchor="middle" font-size="9" font-weight="400">SaaS operator</text>

      <line x1="76" y1="20" x2="100" y2="20" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="2,2"/>

      <rect x="100" y="0" width="76" height="40" rx="6" fill="#fff" stroke="#4ade80" stroke-width="1.5"/>
      <text x="138" y="16" fill="#14532d" text-anchor="middle">AGENCY</text>
      <text x="138" y="30" fill="#166534" text-anchor="middle" font-size="9" font-weight="400">customer</text>

      <line x1="176" y1="20" x2="200" y2="20" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="2,2"/>

      <rect x="200" y="0" width="86" height="40" rx="6" fill="#fff" stroke="#4ade80" stroke-width="1.5"/>
      <text x="243" y="16" fill="#14532d" text-anchor="middle">WORKSPACE</text>
      <text x="243" y="30" fill="#166534" text-anchor="middle" font-size="9" font-weight="400">end client</text>

      <g transform="translate(310, 8)">
        <rect width="180" height="22" rx="11" fill="#fff" stroke="#4ade80"/>
        <text x="90" y="15" font-size="11" font-weight="500" fill="#14532d" text-anchor="middle">BaseRepository&lt;T&gt;</text>
      </g>
    </g>
  </g>

  <!-- ─── Layer 5 — Domain modules ─────────────────────────────────────────── -->
  <g transform="translate(60, 530)">
    <rect width="880" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#9a3412" letter-spacing="0.5">DOMAIN MODULES</text>
    <text x="20" y="52" font-size="13" fill="#c2410c">Out-of-the-box CRUD for the most common B2B SaaS entities</text>

    <g transform="translate(380, 22)">
      <g transform="translate(0, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Contacts</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Conversations</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Messages</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Tags</text>
      </g>
      <g transform="translate(64, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Audit log</text>
      </g>
      <g transform="translate(192, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Billing (Stripe)</text>
      </g>
      <g transform="translate(320, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#fb923c"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#9a3412" text-anchor="middle">Health</text>
      </g>
    </g>
  </g>

  <!-- ─── Layer 6 — Infrastructure ─────────────────────────────────────────── -->
  <g transform="translate(60, 630)">
    <rect width="880" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">INFRASTRUCTURE</text>
    <text x="20" y="52" font-size="13" fill="#334155">Persistence, queues, email, observability, dev tooling</text>

    <g transform="translate(380, 22)">
      <g transform="translate(0, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">Prisma 5</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">PostgreSQL 16</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">BullMQ</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">Redis 7</text>
      </g>
      <g transform="translate(64, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">Resend + React Email</text>
      </g>
      <g transform="translate(192, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">Docker Compose</text>
      </g>
      <g transform="translate(320, 32)">
        <rect width="120" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="60" y="15" font-size="11" font-weight="500" fill="#1f2937" text-anchor="middle">Vitest + Playwright</text>
      </g>
    </g>
  </g>

  <!-- ============================================================
       Cross-cutting concerns (right column, spans all 6 layers)
       Geometry: starts at x=960, spans y=130..720 (590 tall)
       ============================================================ -->
  <g transform="translate(960, 130)">
    <rect width="180" height="590" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle" letter-spacing="0.5">CROSS-CUTTING</text>
    <text x="90" y="46" font-size="10" fill="#991b1b" text-anchor="middle">enforced at every layer</text>

    <!-- 3 vertical pills -->
    <g transform="translate(20, 70)">
      <rect width="140" height="160" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="70" y="26" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Zod validation</text>
      <text x="70" y="48" font-size="10" fill="#991b1b" text-anchor="middle">Single source of truth</text>
      <text x="70" y="62" font-size="10" fill="#991b1b" text-anchor="middle">for types — shared</text>
      <text x="70" y="76" font-size="10" fill="#991b1b" text-anchor="middle">by API + frontend.</text>
      <text x="70" y="100" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">@wa-kijo/shared</text>
      <text x="70" y="114" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">→ DTOs</text>
      <text x="70" y="128" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">→ env.schema</text>
      <text x="70" y="142" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">→ forms</text>
    </g>

    <g transform="translate(20, 240)">
      <rect width="140" height="160" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="70" y="26" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Tenant isolation</text>
      <text x="70" y="48" font-size="10" fill="#991b1b" text-anchor="middle">Every query auto-</text>
      <text x="70" y="62" font-size="10" fill="#991b1b" text-anchor="middle">scoped by ctx.orgId</text>
      <text x="70" y="76" font-size="10" fill="#991b1b" text-anchor="middle">via Prisma middleware.</text>
      <text x="70" y="100" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">BaseRepository&lt;T&gt;</text>
      <text x="70" y="114" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">+ AsyncLocalStorage</text>
      <text x="70" y="128" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">+ cross-tenant fuzz</text>
      <text x="70" y="142" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">tests in CI</text>
    </g>

    <g transform="translate(20, 410)">
      <rect width="140" height="160" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="70" y="26" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Audit logging</text>
      <text x="70" y="48" font-size="10" fill="#991b1b" text-anchor="middle">Sensitive mutations</text>
      <text x="70" y="62" font-size="10" fill="#991b1b" text-anchor="middle">recorded automatically</text>
      <text x="70" y="76" font-size="10" fill="#991b1b" text-anchor="middle">via Prisma middleware.</text>
      <text x="70" y="100" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Role changes</text>
      <text x="70" y="114" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Org config updates</text>
      <text x="70" y="128" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Bulk operations</text>
      <text x="70" y="142" font-size="10" font-style="italic" fill="#b91c1c" text-anchor="middle">Soft-delete actions</text>
    </g>
  </g>

  <!-- ============================================================
       Footer — quickstart command
       ============================================================ -->
  <g transform="translate(60, 760)">
    <rect width="1080" height="80" rx="10" fill="#0f172a"/>
    <text x="20" y="34" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">QUICK START</text>
    <text x="20" y="60" font-size="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#f1f5f9">git clone github.com/benharundev/wa-kijo &amp;&amp; cd wa-kijo &amp;&amp; pnpm install &amp;&amp; pnpm docker:up &amp;&amp; pnpm db:migrate &amp;&amp; pnpm db:seed &amp;&amp; pnpm dev</text>

    <text x="1060" y="60" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="end">6 commands</text>
    <text x="1060" y="34" font-size="11" fill="#64748b" text-anchor="end">localhost:3001 — ready to extend</text>
  </g>

</svg>
